name: papermind

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: papermind-db
    environment:
      POSTGRES_USER: papermind
      POSTGRES_PASSWORD: papermind
      POSTGRES_DB: papermind
    ports:
      # 5432 is standard; override via .env if your machine has another postgres there.
      - "5432:5432"
    volumes:
      - papermind_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U papermind -d papermind"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  papermind_pgdata: